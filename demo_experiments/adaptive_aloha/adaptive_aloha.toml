# Adaptive framed ALOHA on 38.391: 12 hybrid Tags placed at random 5 to 40 m around the base
# station, SIC on. Each frame is a CBRA paging offering 2^v access occasions (v starts at 5 and
# stays within 1 to 5) plus the Access Triggers that play them out. The Reader answers every Msg1
# with a Random ID Response, which brings the Tag's data, and moves v one step per frame towards
# the load it measured. The run writes adaptation.csv. Seeded with 7.

[run]
sim_time_ms = 15001
seed = 7

[reader]
protocol = "adaptive_aloha"
enable_sic = true

[reader.params]
start_exp = 5
min_exp = 1
max_exp = 5

[phy]
# The Rel-19 A-IoT link (amber.link.LinkConfig; 38.291 and 38.391 parameters). Every key is required.
m_chip_symb = 6          # R2D chips per OFDM symbol, 2/6/12/24 (38.291 §6.2.4)
n_rb = 0                 # R2D PRBs; 0 = the smallest the m_chip_symb allows
t_bit_tau = "1/8"        # D2R bit duration, in tau = 2/15 ms
r_sfs = [1, 2, 4, 8]     # small frequency shift factors a paging offers
x = 1                    # time slots of access occasions per paging / Access Trigger
r_code = true            # D2R FEC (TBCC 1/3)
r_block = 1              # D2R block repetition, 1 or 2
l_amble = 31             # D2R preamble and midamble length, 7 or 31
interval_cp = 0          # Interval Bits codepoint 0..3
i_add = false            # additional D2R midamble
d2r_tbs = 5              # D2R transport block in bytes: 2-byte header + node id + value
modulation = "bpsk"      # the Tags' D2R modulation, "bpsk" or "ook" (not signalled)
timing_error = 0.5       # a Tag's largest D2R start error, as a fraction of Te (38.191 §9.2.1)
tag_snr_db = 10.0        # R2D SNR a Tag has at its sensitivity_dbm

[[base_station]]
id = 0
x = 0
y = 0
site_radius = 2
sectors = [
  { azimuth_deg = 0,   beamwidth_deg = 65, power = 46, antenna_gain_dbi = 15, sensitivity_dbm = -100, height = 25 },
  { azimuth_deg = 120, beamwidth_deg = 65, power = 46, antenna_gain_dbi = 15, sensitivity_dbm = -100, height = 25 },
  { azimuth_deg = 240, beamwidth_deg = 65, power = 46, antenna_gain_dbi = 15, sensitivity_dbm = -100, height = 25 },
]

[radio]
freq_hz = 924e6
pathloss_model = "macro"
los = true
combine_mode = "max"

[energy]
trace = "../threehundred_seconds_stable.xlsx"
column = "V_IM"
resistance = 5e3

[tag_defaults]
height = 1.5
sensitivity_dbm = -34       # R2D sensitivity, 38.191 Table 7.2.2-1 device REFSENS
efficiency = 0.7

[tag_defaults.capacitor]
C = 300e-6
R_series = 5e3
R_leakage = 0.1e6
dt = 1e-3
initial_voltage = 0.0

[tag_defaults.controller]
currents = { listening = 1.4e-4, sensing = 0.512e-3, processing = 1.28e-3, transmitting = 5e-3 }
durations_ms = { listening = 5, sensing = 2, processing = 5, transmitting = 15 }
thresholds_v = { low = 1.3, high = 1.7 }

[[tag_group]]
energy_mode = "hybrid"
count = 12
layout = { kind = "ring", r_min = 5.0, r_max = 40.0, seed = 7 }
