# Amber's broadcast demo: 3 Tags (WPT, WPT, hybrid) answer a broadcast send_data in one of two
# slots, no SIC. No seed, as the demo has none: every run is a new sample.

[run]
sim_time_ms = 20001

[reader]
protocol = "broadcast"
enable_sic = false

[reader.params]
slots = 2
tx_ms = 5
rx_ms = 10

[phy]
# The link this scenario runs on, as the Reader and every Tag use it: bit rates and subcarrier step
r2d_kbps = 80
d2r_kbps = 60
subcarrier_khz = 240

[[base_station]]
id = 0
x = 0
y = 0
site_radius = 2
sectors = [
  { azimuth_deg = 0,   beamwidth_deg = 65, power = 46, antenna_gain_dbi = 15, sensitivity_dbm = -100, height = 25 },
  { azimuth_deg = 120, beamwidth_deg = 65, power = 46, antenna_gain_dbi = 15, sensitivity_dbm = -100, height = 25 },
  { azimuth_deg = 240, beamwidth_deg = 65, power = 46, antenna_gain_dbi = 15, sensitivity_dbm = -100, height = 25 },
]

[radio]
freq_hz = 924e6
pathloss_model = "macro"
los = true
combine_mode = "max"

[energy]
trace = "../threehundred_seconds_stable.xlsx"
column = "V_IM"
resistance = 5e3

[tag_defaults]
height = 1.5
sensitivity_dbm = -100
efficiency = 0.7

[tag_defaults.capacitor]
C = 300e-6
R_series = 5e3
R_leakage = 0.1e6
dt = 1e-3
initial_voltage = 0.0

[tag_defaults.controller]
currents = { listening = 1.4e-4, sensing = 0.512e-3, processing = 1.28e-3, transmitting = 5e-3 }
durations_ms = { listening = 5, sensing = 2, processing = 5, transmitting = 15 }
thresholds_v = { low = 1.3, high = 1.7 }

[[tag_group]]
energy_mode = "wpt"
positions = [[0, 20], [0, 30]]

[[tag_group]]
energy_mode = "hybrid"
positions = [[0, 100]]
