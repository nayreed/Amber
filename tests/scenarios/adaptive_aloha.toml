# The adaptive_aloha demo: adaptive framed-slotted ALOHA driven by a BSBehavior policy, twelve
# Tags placed at random around the base station, SIC on.

[run]
sim_time_ms = 6001
seed = 12345

[reader]
protocol = "adaptive_aloha"
enable_sic = true

[reader.params]
start_slots = 20
min_slots = 2
max_slots = 32
tx_ms = 5
slot_ms = 8

[phy]
r2d_kbps = 80
d2r_kbps = 60
subcarrier_khz = 240

[[base_station]]
id = 0
x = 0
y = 0
site_radius = 2
sectors = [
  { azimuth_deg = 0,   beamwidth_deg = 65, power = 46, antenna_gain_dbi = 15, sensitivity_dbm = -100, height = 25 },
  { azimuth_deg = 120, beamwidth_deg = 65, power = 46, antenna_gain_dbi = 15, sensitivity_dbm = -100, height = 25 },
  { azimuth_deg = 240, beamwidth_deg = 65, power = 46, antenna_gain_dbi = 15, sensitivity_dbm = -100, height = 25 },
]

[radio]
freq_hz = 924e6
pathloss_model = "macro"
los = true
combine_mode = "max"

[energy]
trace = "../../demo_experiments/threehundred_seconds_stable.xlsx"
column = "V_IM"
resistance = 5e3

[tag_defaults]
height = 1.5
sensitivity_dbm = -100
efficiency = 0.7

[tag_defaults.capacitor]
C = 300e-6
R_series = 5e3
R_leakage = 0.1e6
dt = 1e-3
initial_voltage = 0.0

[tag_defaults.controller]
currents = { listening = 1.4e-4, sensing = 0.512e-3, processing = 1.28e-3, transmitting = 5e-3 }
durations_ms = { listening = 5, sensing = 2, processing = 5, transmitting = 15 }
thresholds_v = { low = 1.3, high = 1.7 }

[[tag_group]]
energy_mode = "hybrid"
count = 12
layout = { kind = "ring", r_min = 5.0, r_max = 40.0, seed = 7 }
